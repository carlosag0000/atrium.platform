# Caddy (in /opt/atrium/deploy) terminates HTTPS and forwards the visitor's address.
ServerName localhost
ServerTokens Prod
ServerSignature Off
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<VirtualHost *:80>
    # Visitors always reach the site over HTTPS (through Caddy), so redirects Apache builds must use https.
    ServerName https://www.atriumad.com:443
    UseCanonicalName On
    ServerAlias atriumad.com
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# cdn.atriumad.com: client media, files only
<VirtualHost *:80>
    ServerName cdn.atriumad.com
    DocumentRoot /var/www/cdn
    <Directory /var/www/cdn>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php\d?|phtml|phar|html?|js|svg)$">
            Require all denied
        </FilesMatch>
    </Directory>
    Header set Access-Control-Allow-Origin "*"
    ExpiresActive On
    ExpiresDefault "access plus 1 month"
</VirtualHost>
